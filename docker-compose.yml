services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: go_split
      POSTGRES_PASSWORD: go_split
      POSTGRES_DB: go_split
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U go_split -d go_split"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
