basePath: /
definitions:
  auth.accountResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  auth.errorResponse:
    properties:
      error:
        type: string
    type: object
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  auth.registerRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 64
        minLength: 1
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
info:
  contact: {}
  title: go-split-backend service
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verify the host's email + password, then set a session cookie.
      parameters:
      - description: Host login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.accountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Log in a host account
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Create a host account with name, email, and password. Sets a
        session cookie on success. Only hosts have accounts;
        co-organizers and participants join through /auth/join.
      parameters:
      - description: Host registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.accountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Register a host account
      tags:
      - auth
  /healthz:
    get:
      description: Usage for checking service liveness
      produces:
      - application/json
      responses:
        "200":
          description: ok
      summary: Health check
schemes:
- https
swagger: "2.0"
