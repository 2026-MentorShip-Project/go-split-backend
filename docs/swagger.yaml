basePath: /
definitions:
  auth.accountResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  auth.errorResponse:
    properties:
      error:
        type: string
    type: object
  auth.joinRequest:
    properties:
      code:
        maxLength: 32
        minLength: 1
        type: string
      email:
        type: string
      phone:
        maxLength: 32
        minLength: 1
        type: string
    required:
    - code
    - email
    - phone
    type: object
  auth.joinResponse:
    properties:
      event_id:
        type: integer
      guest_id:
        type: integer
      role:
        type: string
    type: object
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 1
        type: string
    required:
    - email
    - password
    type: object
  auth.recoverRequest:
    properties:
      code:
        maxLength: 32
        minLength: 1
        type: string
      email:
        type: string
      phone:
        maxLength: 32
        minLength: 1
        type: string
    required:
    - code
    - email
    - phone
    type: object
  auth.recoverResponse:
    properties:
      event_id:
        type: integer
      guest_id:
        type: integer
    type: object
  auth.registerRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 64
        minLength: 1
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  events.createEventRequest:
    properties:
      ends_at:
        type: string
      name:
        maxLength: 120
        minLength: 1
        type: string
      place:
        maxLength: 200
        type: string
      starts_at:
        type: string
      template:
        type: string
    required:
    - name
    - template
    type: object
  events.createEventResponse:
    properties:
      ends_at:
        type: string
      id:
        type: integer
      invite_code:
        type: string
      name:
        type: string
      place:
        type: string
      starts_at:
        type: string
      template:
        type: string
    type: object
  events.errorResponse:
    properties:
      error:
        type: string
    type: object
  events.eventListItem:
    properties:
      archived:
        type: boolean
      ends_at:
        type: string
      id:
        type: integer
      member_count:
        type: integer
      name:
        type: string
      place:
        type: string
      role:
        type: string
      settled:
        type: boolean
      starts_at:
        type: string
      template:
        type: string
    type: object
  events.eventsResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/events.eventListItem'
        type: array
    type: object
  events.joinRequest:
    properties:
      code:
        maxLength: 32
        minLength: 1
        type: string
    required:
    - code
    type: object
  events.joinResponse:
    properties:
      event_id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
  events.templateItem:
    properties:
      content:
        type: object
      description:
        type: string
      label:
        type: string
    type: object
  events.templatesResponse:
    properties:
      templates:
        items:
          $ref: '#/definitions/events.templateItem'
        type: array
    type: object
info:
  contact: {}
  title: go-split-backend service
  version: "1.0"
paths:
  /auth/join:
    post:
      consumes:
      - application/json
      description: |-
        Look up the invite code, create a guest identity if the
        email + phone combination is new, attach the guest to the
        event as a participant, and set a session cookie. The
        invite code is only accepted while the event is not settled.
      parameters:
      - description: Guest first-join
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.joinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.joinResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Guest first-join by invite code
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verify the host's email + password, then set a session cookie.
      parameters:
      - description: Host login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.accountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Log in a host account
      tags:
      - auth
  /auth/logout:
    post:
      description: |-
        Deletes the session row named by the cookie and clears the
        cookie. Safe to call without a cookie.
      produces:
      - application/json
      responses:
        "204":
          description: no content
      summary: End the current session
      tags:
      - auth
  /auth/recover:
    post:
      consumes:
      - application/json
      description: |-
        All three of invite code, email, and phone must match an
        existing guest membership. On success a new session cookie
        is issued for the original guest id. Only valid while the
        event is not settled.
      parameters:
      - description: Guest session recovery
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.recoverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.recoverResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Recover a guest session by invite code
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Create a host account with name, email, and password. Sets a
        session cookie on success. Only hosts have accounts;
        co-organizers and participants join through /auth/join.
      parameters:
      - description: Host registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.accountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.errorResponse'
      summary: Register a host account
      tags:
      - auth
  /events:
    get:
      description: |-
        Returns every event the caller belongs to (as host, co, or
        member), each with role, member count, settled and archived
        flags, and template. Sorted newest event first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/events.eventsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/events.errorResponse'
      summary: List the current user's events
      tags:
      - events
    post:
      consumes:
      - application/json
      description: |-
        Host-only. Persists the event, adds the host to event_members
        with role 'host', and issues an invite code atomically. The
        response carries the code so the client can jump straight to
        the invite screen without a second round-trip.
      parameters:
      - description: New event
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/events.createEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/events.createEventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/events.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/events.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/events.errorResponse'
      summary: Create a new event
      tags:
      - events
  /events/join:
    post:
      consumes:
      - application/json
      description: |-
        Attach the current session's user to the event named by the
        code as a participant. Idempotent: an existing membership
        keeps its role (a co-organizer promoted by the host stays
        a co-organizer). Rejects codes for settled events with 410.
      parameters:
      - description: Invite code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/events.joinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/events.joinResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/events.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/events.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/events.errorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/events.errorResponse'
      summary: Join an existing event by invite code
      tags:
      - events
  /healthz:
    get:
      description: Usage for checking service liveness
      produces:
      - application/json
      responses:
        "200":
          description: ok
      summary: Health check
  /templates:
    get:
      description: |-
        Returns each seeded template with its label, description, and
        full JSON content (item_tags, cond_tags, rules). The client
        caches this for the create-event picker and reuses the
        content when applying a template to a new event's settings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/events.templatesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/events.errorResponse'
      summary: List every template in the catalog
      tags:
      - templates
schemes:
- https
swagger: "2.0"
