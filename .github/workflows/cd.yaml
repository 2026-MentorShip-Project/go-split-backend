name: cd

permissions:
  contents: read
  id-token: write # REQUIRED: Allows GitHub to issue the short-lived OIDC JWT token

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - '**'
    paths:
      - cmd/**
      - internal/**
      - .github/workflows/**
      - deploy/gcp/**
      - Dockerfile
      - go.mod
      - go.sum

env:
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPO_NAME: ${{ vars.GAR_REPO_NAME }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Changed Files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'deploy/**'
              - '*.tf'
            app:
              - 'cmd/**'
              - 'internal/**'
              - 'Dockerfile'
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ------------------------------------------------------------------------
      # STEP A: Provision infrastructure before deployment
      # ------------------------------------------------------------------------
      - name: Setup Terraform
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.app == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.app == 'true'
        working-directory: deploy/gcp
        env:
          TF_VAR_gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ env.GCP_REGION }}
          TF_VAR_cloud_run_service: ${{ env.CLOUD_RUN_SERVICE }}
          TF_VAR_gar_repository_id: ${{ env.GAR_REPO_NAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform apply -auto-approve -input=false

      # ------------------------------------------------------------------------
      # STEP B: Build & Deploy Application (If Application files changed)
      # ------------------------------------------------------------------------
      - name: Configure Docker Auth for GAR
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        env:
          IMAGE_TAG: "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_NAME }}/go-backend:${{ github.sha }}"
        run: |
          docker build -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"

      - name: Deploy to Cloud Run
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_NAME }}/go-backend:${{ github.sha }}"
