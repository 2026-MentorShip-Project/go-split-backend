name: cd

permissions:
  contents: read
  id-token: write # REQUIRED: Allows GitHub to issue the short-lived OIDC JWT token

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - cmd/**
      - internal/**
      - .github/workflows/**
      - deploy/gcp/**
      - Dockerfile
      - go.mod
      - go.sum

env:
  WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
  SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_REPO_NAME: ${{ vars.GAR_REPO_NAME }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    # Engine-only releases must not migrate databases or deploy Cloud Run.
    if: ${{ !startsWith(github.ref, 'refs/tags/engine-v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Changed Files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'deploy/**'
              - '*.tf'
            app:
              - 'cmd/**'
              - 'internal/**'
              - 'Dockerfile'
              - 'go.mod'
              - 'go.sum'
              - '**/*.go'
            seed:
              - 'cmd/seed-templates/**'
              - 'internal/events/templates/**'
              - 'internal/events/seed.go'
              - 'internal/database/migrations/**'
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ------------------------------------------------------------------------
      # STEP A: Provision infrastructure before deployment
      # ------------------------------------------------------------------------
      - name: Setup Terraform
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.app == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.app == 'true'
        working-directory: deploy/gcp
        env:
          TF_VAR_gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_gcp_region: ${{ env.GCP_REGION }}
          TF_VAR_cloud_run_service: ${{ env.CLOUD_RUN_SERVICE }}
          TF_VAR_gar_repository_id: ${{ env.GAR_REPO_NAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          terraform init -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform apply -auto-approve -input=false


      # ------------------------------------------------------------------------
      # STEP A2: Seed reference data (migrations + templates)
      # ------------------------------------------------------------------------
      # Runs before Cloud Run is deployed so the new revision boots against a
      # fully-migrated schema. Idempotent: schema_migrations gates the
      # migration replay and templates are upserted, so a re-run is a no-op.
      - name: Set up Go
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.seed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Cloud SQL Auth Proxy
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.seed == 'true'
        env:
          INSTANCE_CONNECTION_NAME: "${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:go-split-postgres"
        run: |
          curl -sSLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.15.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 --auto-iam-authn=false "$INSTANCE_CONNECTION_NAME" >proxy.log 2>&1 &
          echo $! > proxy.pid
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "proxy up"; exit 0
            fi
            sleep 1
          done
          echo "proxy failed to start"; cat proxy.log; exit 1

      - name: Seed templates and run migrations
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' || steps.filter.outputs.seed == 'true'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: go_split
          DB_NAME: go_split
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: go run ./cmd/seed-templates

      - name: Stop Cloud SQL Auth Proxy
        if: always() && hashFiles('proxy.pid') != ''
        run: kill "$(cat proxy.pid)" || true

      # ------------------------------------------------------------------------
      # STEP B: Build & Deploy Application (If Application files changed)
      # ------------------------------------------------------------------------
      - name: Configure Docker Auth for GAR
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        env:
          IMAGE_TAG: "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_NAME }}/go-backend:${{ github.sha }}"
        run: |
          docker build -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"

      - name: Deploy to Cloud Run
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.app == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_NAME }}/go-backend:${{ github.sha }}"
